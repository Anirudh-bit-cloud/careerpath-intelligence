name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test-and-lint:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx pyjwt pyotp apscheduler lifelines alembic psycopg2-binary ruff mypy

      - name: Run Ruff Lint Check
        run: |
          ruff check backend/app

      - name: Run Pytest Suite
        run: |
          python -m pytest --maxfail=1 --disable-warnings -v

  frontend-build-and-lint:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type Check & Production Build
        working-directory: ./frontend
        run: |
          npm run build

  docker-build-verification:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: [backend-test-and-lint, frontend-build-and-lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: careerpath-intelligence:latest
